[workspace]
members = [".", "desktop"]
resolver = "2"

[package]
name = "unicity-agentic-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
surrealdb = { version = "2.3.10", features = ["kv-mem"] }
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "chrono"] }
fluent-uri = { version = "0.3.2", features = ["serde"] }
embed_anything = "0.6.5"
thiserror = "2.0.17"
reqwest = "0.12.24"
hnsw_rs = "0.3.2"
clap = { version = "4.5", features = ["derive", "env"] }
