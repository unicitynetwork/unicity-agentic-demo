[package]
name = "unicity-agentic-demo-ui"
version = "0.1.0"
edition = "2021"

#[lib]
#name = "unicity_agentic_demo_ui"
#crate-type = ["cdylib"]

[dependencies]
unicity-agentic-demo = { path = ".." }
tauri = { version = "2.0", features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0.17"
surrealdb = { version = "2.3.10", features = ["kv-mem"] }
once_cell = "1.21.3"

# Audio processing
cpal = "0.16.0"
rubato = "0.16.2"

# Candle and Whisper
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
tokenizers = "0.22.1"
hf-hub = "0.4.3"

# Utilities
byteorder = "1.4"
rand = "0.9.2"
rand_distr = "0.4"
crossbeam-channel = "0.5.15"
dirs = "6.0.0"
futures-util = "0.3.31"
kalosm = { version = "0.4", features = ["sound"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["metal"]
custom-protocol = ["tauri/custom-protocol"]
# GPU acceleration features
accelerate = ["candle-core/accelerate"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "kalosm/metal"]
